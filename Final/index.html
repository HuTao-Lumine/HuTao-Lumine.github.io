<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Art Gallery</title>
    <script type="module" crossorigin src="./assets/index-DK9lSBrz.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DIMlRT2f.css">
  </head>
  <body>
    <!-- Lobby / Setup UI -->
    <div id="lobby-ui" class="overlay">
      <div class="lobby-content">
        <h1>3D Art Gallery Setup</h1>
        
        <div class="setup-section">
          <h2>1. Tải ảnh lên (Upload Artworks)</h2>
          <input type="file" id="image-upload" multiple accept="image/*" />
          <div id="image-preview-container" class="scroll-container"></div>
        </div>

        <div class="setup-section">
          <h2>2. Nhạc nền (Background Music)</h2>
          <p>Nhạc mặc định đã được tự động nạp. Bạn có thể tải thêm hoặc reset.</p>
          <div class="music-controls-lobby">
            <input type="file" id="music-upload" multiple accept="audio/mpeg, audio/mp3, audio/wav" />
            <button id="reset-music-btn" class="danger-btn">Reset Nhạc (Xóa hết)</button>
          </div>
          <div id="music-list-lobby"></div>
        </div>

        <button id="start-btn" class="primary-btn">Start Gallery</button>
      </div>
    </div>

    <!-- In-Game UI -->
    <div id="game-ui" style="display: none;">
      <div id="crosshair">+</div>
      <div id="instructions">
        WASD: Di chuyển | Chuột: Nhìn xung quanh<br>
        Giữ ALT: Mở khóa chuột | ESC: Menu
      </div>
      
      <!-- Music Player UI in 3D -->
      <div id="music-player">
        <div class="music-info">
          <span id="current-song-name">Đang phát: ...</span>
        </div>
        <div class="music-actions">
          <button id="prev-btn">⏮</button>
          <button id="play-pause-btn">⏸</button>
          <button id="next-btn">⏭</button>
        </div>
        <div class="music-volume">
          <label for="volume-slider">Volume:</label>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
        </div>
      </div>
    </div>

  </body>
</html>
